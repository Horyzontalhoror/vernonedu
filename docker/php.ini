[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
pcov.directory = .

; Temporary directory PHP di dalam container
sys_temp_dir = /tmp
upload_tmp_dir = /tmp

; Pastikan session juga memiliki lokasi writable
session.save_path = "/tmp"

; Nonaktifkan JIT karena ada Xdebug/extension lain
opcache.jit = 0
opcache.jit_buffer_size = 0